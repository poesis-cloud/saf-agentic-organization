slug: lean-business-case
description: 'Analyze one Epic in the analyzing state: define its MVP, estimate its cost and projected value, and recommend go or no-go. Main artifact at the human gate: lean-business-case. Use for: Business case, MVP definition, cost estimate, go/no-go for an Epic under analysis.'
orchestrator: value-management-officer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- value-management-officer-catalog
predecessors:
- epic-hypothesis
steps:
- slug: draft
  description: 'Main artifact, draft: the Epic Owner creates or thickens the Lean Business Case.'
  actor: epic-owner
  skills: epic-owner
  artifact: lean-business-case
  instructions:
  - step-contract
  - draft-main
  - lean-business-case-brief
  capabilities:
    deep-reasoning: 9
    coding: 0
    tool-use: 4
    long-context: 7
    multimodal: 0
    writing-quality: 9
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  conditions:
  - kind: precondition
    slug: an-epic-is-under-analysis
    setSelector:
      setQuery: workspace.filter(a, a.kind == 'epic' && a.data.status in ['analyzing', 'ready', 'implementing'])
    setPredicate: selected.size() > 0
  - kind: postcondition
    slug: case-names-an-epic-under-analysis
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, workspace.exists(e, e.kind == 'epic' && e.path == a.data.epic && e.data.status in ['analyzing', 'ready', 'implementing']))
- slug: challenge-enterprise-architect
  description: 'Challenge packet: the Enterprise Architect challenges the drafted Lean Business Case. Not itself challenged.'
  actor: enterprise-architect
  skills: enterprise-architect
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - lean-business-case-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
