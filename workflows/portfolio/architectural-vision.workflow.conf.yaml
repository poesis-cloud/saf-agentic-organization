slug: architectural-vision
description: >
  Purpose: establish the portfolio architectural runway and NFR backbone. Act:
  Demand. Orchestrator: Value Management Officer. In-scope mains:
  architecture-vision, epic-enabler, epic. Challenges: security (NFR
  backbone), operability (not evaluated). Owner updates: after the Vision
  rewrite, the Enterprise Architect writes the Vision's decisions on the
  Enabler Epic into it (closed open items, MVP Feature seeds, runway WSJF),
  then the Business Owner writes those on the business Epic into it (every
  step commits its artifact: an Epic the Vision does not touch gets a
  no-change entry). Evaluate: those mains; KO reiterates the workflow (new
  instance; that main's owner step absorbs the KO).
  Use when: portfolio NFR backbone, target ARTs, enabler Epic seeds, Architectural
  Vision itself. Refuse ART ADRs (architectural-runway-extension). Refuse Epic
  hypothesis (epic-lean-business-case). Strategic Portfolio Review may confirm
  this main during Cadence; it does not replace this practice.
instructions: value-management-officer-interpret-speech-acts
predecessors:
- epic-lean-business-case
orchestrator: value-management-officer
skills: portfolio-architectural-vision
