slug: epic-enabler-hypothesis
description: 'Capture or thicken one enabler Epic (runway, platform, exploration or compliance) as an Epic hypothesis ready for Portfolio Leadership to review. Main artifact at the human gate: epic-enabler. Use for: Runway or platform work at portfolio size; an enabler Epic the Architecture Vision names; a replatforming, migration or compliance programme; thicken an enabler Epic in the funnel or under review.'
orchestrator: value-management-officer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- value-management-officer-catalog
predecessors:
- architecture-vision
steps:
- slug: draft
  description: 'Main artifact, draft: the Enterprise Architect creates or thickens the Enabler Epic.'
  actor: enterprise-architect
  skills: enterprise-architect
  artifact: epic-enabler
  instructions:
  - step-contract
  - draft-main
  - epic-enabler-hypothesis-brief
  capabilities:
    deep-reasoning: 9
    coding: 0
    tool-use: 4
    long-context: 7
    multimodal: 0
    writing-quality: 9
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  conditions:
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'enterprise-architect')
- slug: challenge-solution-architect
  description: 'Challenge packet: the Solution Architect challenges the drafted Enabler Epic. Not itself challenged.'
  actor: solution-architect
  skills: solution-architect
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - epic-enabler-hypothesis-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
