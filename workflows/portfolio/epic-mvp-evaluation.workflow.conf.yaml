slug: epic-mvp-evaluation
description: 'Evaluate the MVP of one implementing Epic against its hypothesis and recommend to persevere, pivot or stop. Main artifact at the human gate: epic. Use for: MVP results are in; pivot or persevere; stop an Epic.'
orchestrator: value-management-officer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- value-management-officer-catalog
predecessors:
- lean-business-case
steps:
- slug: draft
  description: 'Main artifact, draft: the Epic Owner creates or thickens the Epic.'
  actor: epic-owner
  skills: epic-owner
  artifact: epic
  instructions:
  - step-contract
  - draft-main
  - epic-mvp-evaluation-brief
  capabilities:
    deep-reasoning: 9
    coding: 0
    tool-use: 4
    long-context: 7
    multimodal: 0
    writing-quality: 9
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  conditions:
  - kind: precondition
    slug: an-epic-is-implementing
    setSelector:
      setQuery: workspace.filter(a, a.kind == 'epic' && a.data.status in ['implementing'])
    setPredicate: selected.size() > 0
- slug: challenge-data-analyst
  description: 'Challenge packet: the Data Analyst challenges the drafted Epic. Not itself challenged.'
  actor: data-analyst
  skills: data-analyst
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - epic-mvp-evaluation-brief
  capabilities:
    deep-reasoning: 8
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-business-owner
  description: 'Challenge packet: the Business Owner challenges the drafted Epic. Not itself challenged.'
  actor: business-owner
  skills: business-owner
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - epic-mvp-evaluation-brief
  capabilities:
    deep-reasoning: 8
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-financial-controller
  description: 'Challenge packet: the Financial Controller challenges the drafted Epic. Not itself challenged.'
  actor: financial-controller
  skills: financial-controller
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - epic-mvp-evaluation-brief
  capabilities:
    deep-reasoning: 8
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: revise
  description: 'Main artifact, owner revision: the Epic Owner answers every challenge packet and revises the Epic for the human gate.'
  actor: epic-owner
  skills: epic-owner
  artifact: epic
  instructions:
  - step-contract
  - revise-main
  - epic-mvp-evaluation-brief
  capabilities:
    deep-reasoning: 9
    coding: 0
    tool-use: 4
    long-context: 7
    multimodal: 0
    writing-quality: 9
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  conditions:
  - kind: precondition
    slug: after-challenge-data-analyst
    step: challenge-data-analyst
  - kind: precondition
    slug: after-challenge-business-owner
    step: challenge-business-owner
  - kind: precondition
    slug: after-challenge-financial-controller
    step: challenge-financial-controller
  - kind: postcondition
    slug: revises-the-drafted-artifact
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == step.artifact.path)
    setPredicate: selected.size() == 1
  - kind: postcondition
    slug: every-packet-is-answered
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.outcome == 'pass' && s.artifact.kind == 'challenge')
    setPredicate: selected.all(s, workspace.exists(m, m.path == step.artifact.path && m.data.challengeLedger.exists(l, has(l.packet) && l.packet == s.artifact.path)))
