slug: portfolio-vision
description: 'Describe the future state of the portfolio''s value streams and solutions, from the current-state portfolio canvas to the future-state one. Main artifact at the human gate: portfolio-vision. Use for: Where the portfolio is heading; portfolio canvas; future state.'
orchestrator: value-management-officer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- value-management-officer-catalog
predecessors:
- strategic-themes
steps:
- slug: draft
  description: 'Main artifact, draft: the Portfolio Manager creates or thickens the Portfolio Vision.'
  actor: portfolio-manager
  skills: portfolio-manager
  artifact: portfolio-vision
  instructions:
  - step-contract
  - draft-main
  - portfolio-vision-brief
  capabilities:
    deep-reasoning: 9
    coding: 0
    tool-use: 4
    long-context: 7
    multimodal: 0
    writing-quality: 9
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  conditions:
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'portfolio-manager')
- slug: challenge-enterprise-architect
  description: 'Challenge packet: the Enterprise Architect challenges the drafted Portfolio Vision. Not itself challenged.'
  actor: enterprise-architect
  skills: enterprise-architect
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - portfolio-vision-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-business-analyst
  description: 'Challenge packet: the Business Analyst challenges the drafted Portfolio Vision. Not itself challenged.'
  actor: business-analyst
  skills: business-analyst
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - portfolio-vision-brief
  capabilities:
    deep-reasoning: 8
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-business-owner
  description: 'Challenge packet: the Business Owner challenges the drafted Portfolio Vision. Not itself challenged.'
  actor: business-owner
  skills: business-owner
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - portfolio-vision-brief
  capabilities:
    deep-reasoning: 8
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: revise
  description: 'Main artifact, owner revision: the Portfolio Manager answers every challenge packet and revises the Portfolio Vision for the human gate.'
  actor: portfolio-manager
  skills: portfolio-manager
  artifact: portfolio-vision
  instructions:
  - step-contract
  - revise-main
  - portfolio-vision-brief
  capabilities:
    deep-reasoning: 9
    coding: 0
    tool-use: 4
    long-context: 7
    multimodal: 0
    writing-quality: 9
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  conditions:
  - kind: precondition
    slug: after-challenge-enterprise-architect
    step: challenge-enterprise-architect
  - kind: precondition
    slug: after-challenge-business-analyst
    step: challenge-business-analyst
  - kind: precondition
    slug: after-challenge-business-owner
    step: challenge-business-owner
  - kind: postcondition
    slug: revises-the-drafted-artifact
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == step.artifact.path)
    setPredicate: selected.size() == 1
  - kind: postcondition
    slug: every-packet-is-answered
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.outcome == 'pass' && s.artifact.kind == 'challenge')
    setPredicate: selected.all(s, workspace.exists(m, m.path == step.artifact.path && m.data.challengeLedger.exists(l, has(l.packet) && l.packet == s.artifact.path)))
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'portfolio-manager')
