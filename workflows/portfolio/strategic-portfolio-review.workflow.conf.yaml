slug: strategic-portfolio-review
description: >
  Purpose: keep, pivot, stop, or re-rank portfolio bets. Act: Cadence.
  Orchestrator: Value Management Officer. Dispatch mains: strategic-themes,
  portfolio-vision, portfolio-roadmap, architecture-vision (EA sibling main).
  portfolio-review-decision is mediation, not a main and not evaluated.
  Evaluate: the four mains. Not Demand — kill/pivot of one Epic as a rewrite is
  epic-lean-business-case Demand.
instructions: value-management-officer-interpret-speech-acts
orchestrator: value-management-officer
skills: portfolio-strategic-portfolio-review
steps:
- slug: rerank
  description: Main artifact rewrite — Business Owner re-ranks Strategic Themes.
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 8
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  actor: business-owner
  artifact: strategic-themes
  instructions: portfolio-strategic-portfolio-review-update-strategic-themes
- slug: update-portfolio-vision
  description: Main artifact rewrite — Business Owner updates Portfolio Vision after the theme rerank.
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 8
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  actor: business-owner
  artifact: portfolio-vision
  conditions:
