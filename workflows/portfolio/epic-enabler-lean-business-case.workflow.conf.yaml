slug: epic-enabler-lean-business-case
description: 'Analyze one enabler Epic under analysis: its MVP, its cost and the value it unlocks for the Epics it enables, ending in go or no-go. Main artifact at the human gate: lean-business-case. Use for: Business case, MVP definition, cost estimate, go/no-go for an enabler Epic under analysis.'
orchestrator: value-management-officer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- value-management-officer-catalog
predecessors:
- epic-enabler-hypothesis
steps:
- slug: draft
  description: 'Main artifact, draft: the Enterprise Architect creates or thickens the Lean Business Case.'
  actor: enterprise-architect
  skills: enterprise-architect
  artifact: lean-business-case
  instructions:
  - step-contract
  - draft-main
  - epic-enabler-lean-business-case-brief
  capabilities:
    deep-reasoning: 9
    coding: 0
    tool-use: 4
    long-context: 7
    multimodal: 0
    writing-quality: 9
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  conditions:
  - kind: precondition
    slug: an-epic-enabler-is-under-analysis
    setSelector:
      setQuery: workspace.filter(a, a.kind == 'epic-enabler' && a.data.status in ['analyzing', 'ready', 'implementing'])
    setPredicate: selected.size() > 0
  - kind: postcondition
    slug: case-names-an-epic-enabler-under-analysis
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, workspace.exists(e, e.kind == 'epic-enabler' && e.path == a.data.epic && e.data.status in ['analyzing', 'ready', 'implementing']))
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'enterprise-architect')
- slug: challenge-solution-architect
  description: 'Challenge packet: the Solution Architect challenges the drafted Lean Business Case. Not itself challenged.'
  actor: solution-architect
  skills: solution-architect
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - epic-enabler-lean-business-case-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
