slug: pi-planning
description: >
  Purpose: ART commit for the PI. Act: Cadence. Orchestrator: Release Train
  Engineer. Dispatch: confirm product-vision, product-roadmap, feature intent,
  architecture-runway; write objectives. Challenge: Developer feasibility-review
  of drafted Objectives (not evaluated). risks is ROAM mediation, not a main.
  Evaluate: objectives (and a confirmed main only if the user KOs that intent).
  "I want SSO" here is Refuse — Demand feature-backlog-refinement first.
instructions: release-train-engineer-interpret-speech-acts
predecessors:
- feature-backlog-refinement
orchestrator: release-train-engineer
skills: program-pi-planning
steps:
