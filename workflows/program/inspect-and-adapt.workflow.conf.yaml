slug: inspect-and-adapt
description: >
  Purpose: PI quantitative/qualitative improve. Act: Cadence. Orchestrator:
  Release Train Engineer. Dispatch: pain-point mediation records. Do not
  Evaluate pain-points. A resulting Feature or Enabler is a later Demand
  (feature-backlog-refinement), not I&A writing a Feature.
instructions: release-train-engineer-interpret-speech-acts
orchestrator: release-train-engineer
skills: program-inspect-and-adapt
steps:
  - slug: metrics-review
    description: Mediation record — Release Train Engineer records quantitative/qualitative pain-points. Not itself challenged.
    capabilities:
      deep-reasoning: 7
      coding: 0
      tool-use: 4
      long-context: 6
      multimodal: 0
      writing-quality: 8
      instruction-following: 8
      fast-iteration: 2
      schema-adherence: 8
    actor: release-train-engineer
    artifact: pain-point
    instructions:
      - program-inspect-and-adapt-metrics-review
  - slug: pi-retrospective
    description: Mediation record — Release Train Engineer records retrospective pain-points. Not itself challenged.
    capabilities:
      deep-reasoning: 7
      coding: 0
      tool-use: 4
      long-context: 6
      multimodal: 0
      writing-quality: 8
      instruction-following: 8
      fast-iteration: 2
      schema-adherence: 8
    actor: release-train-engineer
    artifact: pain-point
    instructions:
      - program-inspect-and-adapt-retrospective
    conditions:
      - slug: after-metrics-review
        kind: precondition
        step: metrics-review
