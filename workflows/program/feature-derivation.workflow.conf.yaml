slug: feature-derivation
description: >
  Purpose: split an approved Epic into ART Features (SAFe: Portfolio Epics
  split into Features on the ART backlog). Orchestrator: Release Train
  Engineer. In-scope mains: feature, feature-enabler. Product Manager
  derives the business Feature; System Architect derives the Enabler
  Feature. No challenge protocol here — derived items then enter
  feature-backlog-refinement. Evaluate: those mains. Refuse Feature AC/WSJF
  thickening and NFR traces (that is refinement). Refuse ADR/NFR register
  (that is architectural-runway-extension). There is no Feature-to-Story
  derivation workflow; teams split Features into Stories in
  team-backlog-refinement.
instructions: release-train-engineer-interpret-speech-acts
predecessors:
- epic-lean-business-case
orchestrator: release-train-engineer
skills: program-feature-derivation
steps:
- slug: derive-business
  description: Main artifact draft — Product Manager derives a business Feature from the approved Epic.
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 8
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  actor: product-manager
  artifact: feature
  conditions: []
  instructions: program-feature-derivation-derive-business
- slug: derive-enabler
  description: Main artifact draft — System Architect derives the sibling Enabler Feature from the approved Epic.
  capabilities:
    deep-reasoning: 9
    coding: 0
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 8
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  actor: system-architect
  artifact: feature-enabler
  conditions:
  - slug: after-derive-business
    kind: precondition
    step: derive-business
  instructions: program-feature-derivation-derive-enabler
