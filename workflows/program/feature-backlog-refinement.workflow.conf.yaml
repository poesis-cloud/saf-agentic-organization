slug: feature-backlog-refinement
description: >
  Purpose: write a PI-ready Feature. Act: Demand. Orchestrator: Release Train
  Engineer. In-scope mains: feature, feature-enabler. Same workflow for new
  Feature, thicken AC/WSJF, Feature-sized impact of changing X, Feature-sized
  UX/security gap, Enabler Feature sibling. Challenges of those mains:
  feasibility, architecture-review (SA challenge, not an ADR), security, UX.
  Evaluate: those mains; KO reiterates that main's owner step. Refuse Epic/Story
  grain. Refuse ADR, NFR list, and runway — those are architectural-runway-extension.
  Do not invent Impact Analysis.
instructions: release-train-engineer-interpret-speech-acts
predecessors:
- epic-lean-business-case
- feature-derivation
orchestrator: release-train-engineer
skills: program-feature-backlog-refinement
