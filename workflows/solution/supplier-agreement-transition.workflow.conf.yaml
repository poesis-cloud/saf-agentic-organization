slug: supplier-agreement-transition
description: 'Record the human''s decision on one supplier agreement as a state change. Main artifact at the human gate: supplier-agreement. Use for: "Proceed with / sign / end this supplier agreement".'
orchestrator: solution-train-engineer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- solution-train-engineer-catalog
steps:
- slug: record-transition
  description: 'Owner step: the Procurement Manager records the human''s decision as one state change of the Supplier agreement, or refuses it with the reason.'
  actor: procurement-manager
  skills: procurement-manager
  artifact: supplier-agreement
  instructions:
  - step-contract
  - record-transition
  - supplier-agreement-transition-brief
  capabilities:
    deep-reasoning: 4
    coding: 0
    tool-use: 4
    long-context: 5
    multimodal: 0
    writing-quality: 6
    instruction-following: 9
    fast-iteration: 8
    schema-adherence: 9
  conditions:
  - kind: postcondition
    slug: challenged-before-leaving-draft
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path && a.data.status in ['negotiating', 'active', 'ended'])
    setPredicate: selected.all(a, size(a.data.challengeLedger) > 0)
