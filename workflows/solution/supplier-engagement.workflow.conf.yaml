slug: supplier-engagement
description: 'Write or revise the agreement that brings one supplier into the Solution Train''s cadence, quality expectations and compliance obligations. Main artifact at the human gate: supplier-agreement. Use for: Onboard or change a supplier; contract terms for a component or service.'
orchestrator: solution-train-engineer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- solution-train-engineer-catalog
steps:
- slug: draft
  description: 'Main artifact, draft: the Procurement Manager creates or thickens the Supplier agreement.'
  actor: procurement-manager
  skills: procurement-manager
  artifact: supplier-agreement
  instructions:
  - step-contract
  - draft-main
  - supplier-engagement-brief
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 8
    instruction-following: 8
    fast-iteration: 3
    schema-adherence: 8
  conditions:
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'procurement-manager')
- slug: challenge-legal-counsel
  description: 'Challenge packet: the Legal Counsel challenges the drafted Supplier agreement. Not itself challenged.'
  actor: legal-counsel
  skills: legal-counsel
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - supplier-engagement-brief
  capabilities:
    deep-reasoning: 8
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
