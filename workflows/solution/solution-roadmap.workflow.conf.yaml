slug: solution-roadmap
description: 'Forecast the solution''s deliverables: a PI roadmap (one committed PI, two forecast) and a multi-year view. Main artifact at the human gate: solution-roadmap. Use for: When capabilities land; solution milestones; multi-year plan of the solution.'
orchestrator: solution-train-engineer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- solution-train-engineer-catalog
predecessors:
- solution-vision
steps:
- slug: draft
  description: 'Main artifact, draft: the Solution Manager creates or thickens the Solution Roadmap.'
  actor: solution-manager
  skills: solution-manager
  artifact: solution-roadmap
  instructions:
  - step-contract
  - draft-main
  - solution-roadmap-brief
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 5
    long-context: 7
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 3
    schema-adherence: 8
  conditions: []
- slug: challenge-solution-architect
  description: 'Challenge packet: the Solution Architect challenges the drafted Solution Roadmap. Not itself challenged.'
  actor: solution-architect
  skills: solution-architect
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - solution-roadmap-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-systems-engineer
  description: 'Challenge packet: the Systems Engineer challenges the drafted Solution Roadmap. Not itself challenged.'
  actor: systems-engineer
  skills: systems-engineer
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - solution-roadmap-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-release-manager
  description: 'Challenge packet: the Release Manager challenges the drafted Solution Roadmap. Not itself challenged.'
  actor: release-manager
  skills: release-manager
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - solution-roadmap-brief
  capabilities:
    deep-reasoning: 8
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: revise
  description: 'Main artifact, owner revision: the Solution Manager answers every challenge packet and revises the Solution Roadmap for the human gate.'
  actor: solution-manager
  skills: solution-manager
  artifact: solution-roadmap
  instructions:
  - step-contract
  - revise-main
  - solution-roadmap-brief
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 5
    long-context: 7
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 3
    schema-adherence: 8
  conditions:
  - kind: precondition
    slug: after-challenge-solution-architect
    step: challenge-solution-architect
  - kind: precondition
    slug: after-challenge-systems-engineer
    step: challenge-systems-engineer
  - kind: precondition
    slug: after-challenge-release-manager
    step: challenge-release-manager
  - kind: postcondition
    slug: revises-the-drafted-artifact
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == step.artifact.path)
    setPredicate: selected.size() == 1
  - kind: postcondition
    slug: every-packet-is-answered
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.outcome == 'pass' && s.artifact.kind == 'challenge')
    setPredicate: selected.all(s, workspace.exists(m, m.path == step.artifact.path && m.data.challengeLedger.exists(l, has(l.packet) && l.packet == s.artifact.path)))
