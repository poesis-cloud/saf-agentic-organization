slug: capability-refinement
description: 'Write or thicken one business Capability so it is ready for Pre-Plan: benefit hypothesis, acceptance criteria, WSJF and the Features each ART would take. Main artifact at the human gate: capability. Use for: A new capability; split an Epic into capabilities; make a capability ready.'
orchestrator: solution-train-engineer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- solution-train-engineer-catalog
steps:
- slug: draft
  description: 'Main artifact, draft: the Solution Manager creates or thickens the Capability.'
  actor: solution-manager
  skills: solution-manager
  artifact: capability
  instructions:
  - step-contract
  - draft-main
  - capability-refinement-brief
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 8
    instruction-following: 8
    fast-iteration: 3
    schema-adherence: 8
  conditions:
  - kind: postcondition
    slug: parent-epic-is-approved
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path && a.data.parent != null)
    setPredicate: selected.all(a, workspace.exists(p, p.kind == 'epic' && p.path == a.data.parent && p.data.status in ['ready', 'implementing']))
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'solution-manager')
- slug: challenge-solution-architect
  description: 'Challenge packet: the Solution Architect challenges the drafted Capability. Not itself challenged.'
  actor: solution-architect
  skills: solution-architect
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - capability-refinement-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-systems-engineer
  description: 'Challenge packet: the Systems Engineer challenges the drafted Capability. Not itself challenged.'
  actor: systems-engineer
  skills: systems-engineer
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - capability-refinement-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-security-expert
  description: 'Challenge packet: the Security Expert challenges the drafted Capability. Not itself challenged.'
  actor: security-expert
  skills: security-expert
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - capability-refinement-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-compliance-officer
  description: 'Challenge packet: the Compliance Officer challenges the drafted Capability. Not itself challenged.'
  actor: compliance-officer
  skills: compliance-officer
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - capability-refinement-brief
  capabilities:
    deep-reasoning: 8
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: revise
  description: 'Main artifact, owner revision: the Solution Manager answers every challenge packet and revises the Capability for the human gate.'
  actor: solution-manager
  skills: solution-manager
  artifact: capability
  instructions:
  - step-contract
  - revise-main
  - capability-refinement-brief
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 8
    instruction-following: 8
    fast-iteration: 3
    schema-adherence: 8
  conditions:
  - kind: precondition
    slug: after-challenge-solution-architect
    step: challenge-solution-architect
  - kind: precondition
    slug: after-challenge-systems-engineer
    step: challenge-systems-engineer
  - kind: precondition
    slug: after-challenge-security-expert
    step: challenge-security-expert
  - kind: precondition
    slug: after-challenge-compliance-officer
    step: challenge-compliance-officer
  - kind: postcondition
    slug: revises-the-drafted-artifact
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == step.artifact.path)
    setPredicate: selected.size() == 1
  - kind: postcondition
    slug: every-packet-is-answered
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.outcome == 'pass' && s.artifact.kind == 'challenge')
    setPredicate: selected.all(s, workspace.exists(m, m.path == step.artifact.path && m.data.challengeLedger.exists(l, has(l.packet) && l.packet == s.artifact.path)))
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'solution-manager')
