slug: team-backlog-refinement
description: >
  Purpose: write a ready-enough Story, including splitting a Feature into
  Stories (SAFe: teams split Features into Stories; there is no named
  Story-derivation ceremony). Orchestrator: Scrum Master. In-scope mains:
  story, story-enabler. Same workflow for new Story, bug, spike, debt slice,
  thicken AC, split. Challenges of those mains: feasibility, UX,
  architecture-review (SA challenge, not an ADR). Evaluate: those mains; KO
  reiterates that main's owner step. Refuse Feature/Epic grain. Refuse ADR
  and the product NFR register (hand off to RTE
  architectural-runway-extension). Stories inherit NFR applicability from
  the parent Feature; they do not define NFRs. Do not invent Bug Intake.
instructions: scrum-master-interpret-speech-acts
predecessors:
- feature-backlog-refinement
orchestrator: scrum-master
skills: team-story-backlog-refinement
