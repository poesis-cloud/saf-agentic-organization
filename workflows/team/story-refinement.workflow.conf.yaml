    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-security-expert
  description: 'Challenge packet: the Security Expert challenges the drafted Story. Not itself challenged.'
  actor: security-expert
  skills: security-expert
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - story-refinement-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
