      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: revise
  description: 'Main artifact, owner revision: the Product Owner answers every challenge packet and revises the Story for the human gate.'
  actor: product-owner
  skills: product-owner
  artifact: story
  instructions:
  - step-contract
  - revise-main
  - story-refinement-brief
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 8
    instruction-following: 8
    fast-iteration: 3
    schema-adherence: 8
  conditions:
  - kind: precondition
    slug: after-challenge-software-engineer
    step: challenge-software-engineer
  - kind: precondition
    slug: after-challenge-quality-engineer
    step: challenge-quality-engineer
  - kind: precondition
    slug: after-challenge-security-expert
    step: challenge-security-expert
  - kind: precondition
    slug: after-challenge-ux-designer
    step: challenge-ux-designer
  - kind: postcondition
    slug: revises-the-drafted-artifact
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == step.artifact.path)
    setPredicate: selected.size() == 1
  - kind: postcondition
    slug: every-packet-is-answered
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.outcome == 'pass' && s.artifact.kind == 'challenge')
    setPredicate: selected.all(s, workspace.exists(m, m.path == step.artifact.path && m.data.challengeLedger.exists(l, has(l.packet) && l.packet == s.artifact.path)))
