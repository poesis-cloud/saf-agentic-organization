  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-ux-designer
  description: 'Challenge packet: the UX Designer challenges the drafted Story. Not itself challenged.'
  actor: ux-designer
  skills: ux-designer
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
