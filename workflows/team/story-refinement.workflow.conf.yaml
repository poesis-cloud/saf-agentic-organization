slug: story-refinement
description: 'Write or thicken one Story so it is ready for Iteration Planning: user voice, acceptance criteria and an estimate. Main artifact at the human gate: story. Use for: A new story; split a Feature into stories; a spike; a Story-sized defect or debt item; make a Story ready.'
orchestrator: scrum-master
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- scrum-master-catalog
steps:
- slug: draft
  description: 'Main artifact, draft: the Product Owner creates or thickens the Story.'
  actor: product-owner
  skills: product-owner
  artifact: story
  instructions:
  - step-contract
  - draft-main
  - story-refinement-brief
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 8
    instruction-following: 8
    fast-iteration: 3
    schema-adherence: 8
  conditions:
  - kind: postcondition
    slug: parent-feature-is-approved
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path && a.data.parent != null)
    setPredicate: selected.all(a, workspace.exists(p, p.kind == 'feature' && p.path == a.data.parent && p.data.status in ['ready', 'implementing']))
- slug: challenge-software-engineer
  description: 'Challenge packet: the Software Engineer challenges the drafted Story. Not itself challenged.'
  actor: software-engineer
  skills: software-engineer
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - story-refinement-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-quality-engineer
  description: 'Challenge packet: the Quality Engineer challenges the drafted Story. Not itself challenged.'
  actor: quality-engineer
  skills: quality-engineer
