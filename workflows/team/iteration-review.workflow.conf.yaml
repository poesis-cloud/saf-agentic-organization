slug: iteration-review
description: 'Inspect the iteration increment with stakeholders, assess progress toward the iteration goals and PI Objectives, and adjust the Team Backlog. Main artifact at the human gate: event-record. Use for: End of iteration: what was done; demo the team''s increment.'
orchestrator: scrum-master
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- scrum-master-catalog
steps:
- slug: record
  description: 'Event record: the Scrum Master / Team Coach writes the Iteration Review record.'
  actor: scrum-master
  skills: scrum-master
  artifact: event-record
  instructions:
  - step-contract
  - record-event
  - iteration-review-brief
  capabilities:
    deep-reasoning: 4
    coding: 0
    tool-use: 4
    long-context: 5
    multimodal: 0
    writing-quality: 6
    instruction-following: 9
    fast-iteration: 8
    schema-adherence: 9
  conditions: []
