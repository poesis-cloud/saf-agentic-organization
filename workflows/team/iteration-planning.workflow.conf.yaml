slug: iteration-planning
description: >
  Purpose: commit the iteration. Act: Cadence. Orchestrator: Scrum Master.
  Dispatch: confirm team-manifest; write plan. Challenge: Developer
  feasibility-review of the drafted plan (not evaluated). Evaluate: the plan.
  Not Demand — a new bug or Story is team-backlog-refinement.
instructions: scrum-master-interpret-speech-acts
predecessors:
- team-backlog-refinement
orchestrator: scrum-master
skills: team-iteration-planning
steps:
- slug: confirm-team-manifest
  description: Main artifact confirm — Scrum Master restates team capacity and membership for this iteration.
  capabilities:
    deep-reasoning: 2
    coding: 3
    tool-use: 8
    long-context: 2
    multimodal: 0
    writing-quality: 1
    instruction-following: 9
    fast-iteration: 8
    schema-adherence: 8
  actor: scrum-master
  artifact: team-manifest
  conditions: []
  instructions: team-iteration-planning-confirm-team-manifest
- slug: draft-plan
  description: Main artifact draft — Scrum Master proposes Iteration Goals and the selected Story list.
  capabilities:
    deep-reasoning: 2
    coding: 3
    tool-use: 8
    long-context: 2
    multimodal: 0
    writing-quality: 1
    instruction-following: 9
    fast-iteration: 8
    schema-adherence: 8
  actor: scrum-master
  artifact: plan
  conditions:
  - slug: after-confirm-team-manifest
    kind: precondition
    step: confirm-team-manifest
  instructions: team-iteration-planning-draft-iteration-plan
- slug: challenge-feasibility
  description: Challenge packet — Developer feasibility-review of the drafted Iteration Plan. Not itself challenged.
  capabilities:
    deep-reasoning: 8
    coding: 8
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 3
    schema-adherence: 6
  actor: developer
  artifact: feasibility-review
  conditions:
  - slug: after-draft-plan
    kind: precondition
    step: draft-plan
  instructions: program-feature-backlog-refinement-challenger-writes-no-owner-content
- slug: commit-plan
  description: Owner rewrite — Scrum Master commits the Iteration Plan after the feasibility challenge.
  capabilities:
    deep-reasoning: 2
    coding: 3
    tool-use: 8
    long-context: 2
    multimodal: 0
    writing-quality: 1
    instruction-following: 9
    fast-iteration: 8
    schema-adherence: 8
  actor: scrum-master
  artifact: plan
  conditions:
  - slug: after-challenge-feasibility
    kind: precondition
    step: challenge-feasibility
  instructions: team-iteration-planning-commit-iteration-plan
