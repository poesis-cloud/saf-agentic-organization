slug: product-vision
description: 'Describe the future state of the solution the ART develops: customers, their needs and the features proposed to meet them. Main artifact at the human gate: product-vision. Use for: Where the product is heading; who it is for; what problems it solves.'
orchestrator: release-train-engineer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- release-train-engineer-catalog
predecessors:
- art-launch
steps:
- slug: draft
  description: 'Main artifact, draft: the Product Manager creates or thickens the Product Vision.'
  actor: product-manager
  skills: product-manager
  artifact: product-vision
  instructions:
  - step-contract
  - draft-main
  - product-vision-brief
  capabilities:
    deep-reasoning: 9
    coding: 0
    tool-use: 4
    long-context: 7
    multimodal: 0
    writing-quality: 9
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  conditions: []
- slug: challenge-system-architect
  description: 'Challenge packet: the System Architect challenges the drafted Product Vision. Not itself challenged.'
  actor: system-architect
  skills: system-architect
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - product-vision-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-ux-designer
  description: 'Challenge packet: the UX Designer challenges the drafted Product Vision. Not itself challenged.'
  actor: ux-designer
  skills: ux-designer
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - product-vision-brief
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 4
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-business-owner
  description: 'Challenge packet: the Business Owner challenges the drafted Product Vision. Not itself challenged.'
  actor: business-owner
  skills: business-owner
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - product-vision-brief
  capabilities:
    deep-reasoning: 8
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-product-marketing-manager
  description: 'Challenge packet: the Product Marketing Manager challenges the drafted Product Vision. Not itself challenged.'
  actor: product-marketing-manager
  skills: product-marketing-manager
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - product-vision-brief
  capabilities:
    deep-reasoning: 8
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: revise
  description: 'Main artifact, owner revision: the Product Manager answers every challenge packet and revises the Product Vision for the human gate.'
  actor: product-manager
  skills: product-manager
  artifact: product-vision
  instructions:
  - step-contract
  - revise-main
  - product-vision-brief
  capabilities:
    deep-reasoning: 9
    coding: 0
    tool-use: 4
    long-context: 7
    multimodal: 0
    writing-quality: 9
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  conditions:
  - kind: precondition
    slug: after-challenge-system-architect
    step: challenge-system-architect
  - kind: precondition
    slug: after-challenge-ux-designer
    step: challenge-ux-designer
  - kind: precondition
    slug: after-challenge-business-owner
    step: challenge-business-owner
  - kind: precondition
    slug: after-challenge-product-marketing-manager
    step: challenge-product-marketing-manager
  - kind: postcondition
    slug: revises-the-drafted-artifact
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == step.artifact.path)
    setPredicate: selected.size() == 1
  - kind: postcondition
    slug: every-packet-is-answered
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.outcome == 'pass' && s.artifact.kind == 'challenge')
    setPredicate: selected.all(s, workspace.exists(m, m.path == step.artifact.path && m.data.challengeLedger.exists(l, has(l.packet) && l.packet == s.artifact.path)))
