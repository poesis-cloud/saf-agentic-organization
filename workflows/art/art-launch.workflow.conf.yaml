slug: art-launch
description: 'Define or revise one Agile Release Train: its mission, teams, roles and PI cadence. Main artifact at the human gate: art-canvas. Use for: Set up an ART; change its teams, roles or cadence.'
orchestrator: release-train-engineer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- release-train-engineer-catalog
steps:
- slug: draft
  description: 'Main artifact, draft: the Release Train Engineer creates or thickens the ART canvas.'
  actor: release-train-engineer
  skills: release-train-engineer
  artifact: art-canvas
  instructions:
  - step-contract
  - draft-main
  - art-launch-brief
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 5
    long-context: 7
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 3
    schema-adherence: 8
  conditions: []
- slug: challenge-agile-coach
  description: 'Challenge packet: the Agile Coach challenges the drafted ART canvas. Not itself challenged.'
  actor: agile-coach
  skills: agile-coach
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - art-launch-brief
  capabilities:
    deep-reasoning: 8
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-system-architect
  description: 'Challenge packet: the System Architect challenges the drafted ART canvas. Not itself challenged.'
  actor: system-architect
  skills: system-architect
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - art-launch-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-product-manager
  description: 'Challenge packet: the Product Manager challenges the drafted ART canvas. Not itself challenged.'
  actor: product-manager
  skills: product-manager
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - art-launch-brief
  capabilities:
    deep-reasoning: 8
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: revise
  description: 'Main artifact, owner revision: the Release Train Engineer answers every challenge packet and revises the ART canvas for the human gate.'
  actor: release-train-engineer
  skills: release-train-engineer
  artifact: art-canvas
  instructions:
  - step-contract
  - revise-main
  - art-launch-brief
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 5
    long-context: 7
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 3
    schema-adherence: 8
  conditions:
  - kind: precondition
    slug: after-challenge-agile-coach
    step: challenge-agile-coach
  - kind: precondition
    slug: after-challenge-system-architect
    step: challenge-system-architect
  - kind: precondition
    slug: after-challenge-product-manager
    step: challenge-product-manager
  - kind: postcondition
    slug: revises-the-drafted-artifact
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == step.artifact.path)
    setPredicate: selected.size() == 1
  - kind: postcondition
    slug: every-packet-is-answered
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.outcome == 'pass' && s.artifact.kind == 'challenge')
    setPredicate: selected.all(s, workspace.exists(m, m.path == step.artifact.path && m.data.challengeLedger.exists(l, has(l.packet) && l.packet == s.artifact.path)))
