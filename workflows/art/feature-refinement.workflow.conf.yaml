slug: feature-refinement
description: 'Write or thicken one business Feature so it is ready for PI Planning: benefit hypothesis, acceptance criteria and WSJF. Main artifact at the human gate: feature. Use for: A new feature; split an Epic or Capability into features; a Feature-sized change, defect or gap; make a Feature ready.'
orchestrator: release-train-engineer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- release-train-engineer-catalog
steps:
- slug: draft
  description: 'Main artifact, draft: the Product Manager creates or thickens the Feature.'
  actor: product-manager
  skills: product-manager
  artifact: feature
  instructions:
  - step-contract
  - draft-main
  - feature-refinement-brief
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 8
    instruction-following: 8
    fast-iteration: 3
    schema-adherence: 8
  conditions:
  - kind: postcondition
    slug: parent-is-approved
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path && a.data.parent != null)
    setPredicate: selected.all(a, workspace.exists(p, p.kind == 'epic' && p.path == a.data.parent && p.data.status in ['ready', 'implementing']) || workspace.exists(p, p.kind == 'capability' && p.path == a.data.parent && p.data.status in ['analyzing', 'ready', 'implementing']))
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'product-manager')
- slug: challenge-system-architect
  description: 'Challenge packet: the System Architect challenges the drafted Feature. Not itself challenged.'
  actor: system-architect
  skills: system-architect
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - feature-refinement-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
