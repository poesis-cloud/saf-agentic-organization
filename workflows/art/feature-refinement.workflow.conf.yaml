- slug: revise
  description: 'Main artifact, owner revision: the Product Manager answers every challenge packet and revises the Feature for the human gate.'
  actor: product-manager
  skills: product-manager
  artifact: feature
  instructions:
  - step-contract
  - revise-main
  - feature-refinement-brief
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 8
    instruction-following: 8
    fast-iteration: 3
    schema-adherence: 8
  conditions:
  - kind: precondition
    slug: after-challenge-system-architect
    step: challenge-system-architect
  - kind: precondition
    slug: after-challenge-software-engineer
    step: challenge-software-engineer
  - kind: precondition
    slug: after-challenge-quality-engineer
    step: challenge-quality-engineer
  - kind: precondition
    slug: after-challenge-security-expert
    step: challenge-security-expert
  - kind: precondition
    slug: after-challenge-ux-designer
    step: challenge-ux-designer
  - kind: precondition
    slug: after-challenge-data-protection-officer
    step: challenge-data-protection-officer
  - kind: postcondition
    slug: revises-the-drafted-artifact
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == step.artifact.path)
    setPredicate: selected.size() == 1
  - kind: postcondition
    slug: every-packet-is-answered
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.outcome == 'pass' && s.artifact.kind == 'challenge')
    setPredicate: selected.all(s, workspace.exists(m, m.path == step.artifact.path && m.data.challengeLedger.exists(l, has(l.packet) && l.packet == s.artifact.path)))
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'product-manager')
