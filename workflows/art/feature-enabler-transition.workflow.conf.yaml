slug: feature-enabler-transition
description: 'Record the human''s decision to move one enabler Feature to a new ART Kanban state, then re-render the ART Kanban. Main artifact at the human gate: feature-enabler. Use for: "Approve / commit / move / accept this enabler Feature" after a gate, PI Planning or a System Demo.'
orchestrator: release-train-engineer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- release-train-engineer-catalog
steps:
- slug: record-transition
  description: 'Owner step: the System Architect records the human''s decision as one state change of the Enabler Feature, or refuses it with the reason.'
  actor: system-architect
  skills: system-architect
  artifact: feature-enabler
  instructions:
  - step-contract
  - record-transition
  - feature-enabler-transition-brief
  capabilities:
    deep-reasoning: 4
    coding: 0
    tool-use: 4
    long-context: 5
    multimodal: 0
    writing-quality: 6
    instruction-following: 9
    fast-iteration: 8
    schema-adherence: 9
  conditions:
  - kind: postcondition
    slug: challenged-before-ready
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path && !(a.data.status in ['funnel', 'analyzing']))
    setPredicate: selected.all(a, size(a.data.challengeLedger) > 0)
- slug: update-kanban
  description: 'Flow record: the Release Train Engineer re-renders the Kanban board from the items'' status.'
  actor: release-train-engineer
  skills: release-train-engineer
  artifact: kanban
  instructions:
  - step-contract
  - update-kanban
  - feature-enabler-transition-brief
  capabilities:
    deep-reasoning: 2
    coding: 0
    tool-use: 5
    long-context: 5
    multimodal: 0
    writing-quality: 3
    instruction-following: 9
    fast-iteration: 9
    schema-adherence: 10
  conditions:
  - kind: precondition
    slug: after-record-transition
    step: record-transition
