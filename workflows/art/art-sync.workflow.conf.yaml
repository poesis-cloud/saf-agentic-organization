slug: art-sync
description: 'Inspect the ART''s progress toward its PI Objectives (Coach Sync and PO Sync combined), handle dependencies and impediments, and re-render the ART Kanban. Main artifact at the human gate: event-record. Use for: ART status during the PI; dependencies, impediments or scope adjustments between teams.'
orchestrator: release-train-engineer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- release-train-engineer-catalog
steps:
- slug: record
  description: 'Event record: the Release Train Engineer writes the ART Sync record.'
  actor: release-train-engineer
  skills: release-train-engineer
  artifact: event-record
  instructions:
  - step-contract
  - record-event
  - art-sync-brief
  capabilities:
    deep-reasoning: 4
    coding: 0
    tool-use: 4
    long-context: 5
    multimodal: 0
    writing-quality: 6
    instruction-following: 9
    fast-iteration: 8
    schema-adherence: 9
  conditions: []
- slug: update-kanban
  description: 'Flow record: the Release Train Engineer re-renders the Kanban board from the items'' status.'
  actor: release-train-engineer
  skills: release-train-engineer
  artifact: kanban
  instructions:
  - step-contract
  - update-kanban
  - art-sync-brief
  capabilities:
    deep-reasoning: 2
    coding: 0
    tool-use: 5
    long-context: 5
    multimodal: 0
    writing-quality: 3
    instruction-following: 9
    fast-iteration: 9
    schema-adherence: 10
  conditions:
  - kind: precondition
    slug: after-record
    step: record
