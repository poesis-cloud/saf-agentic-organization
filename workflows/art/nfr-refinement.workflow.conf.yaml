slug: nfr-refinement
description: 'Create or revise the ART''s register of nonfunctional requirements: each one bounded, measurable and verifiable. Main artifact at the human gate: nfrs. Use for: System qualities: security, reliability, performance, scalability, usability, accessibility, privacy, Responsible AI.'
orchestrator: release-train-engineer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- release-train-engineer-catalog
steps:
- slug: draft
  description: 'Main artifact, draft: the System Architect creates or thickens the Nonfunctional requirements.'
  actor: system-architect
  skills: system-architect
  artifact: nfrs
  instructions:
  - step-contract
  - draft-main
  - nfr-refinement-brief
  capabilities:
    deep-reasoning: 9
    coding: 4
    tool-use: 5
    long-context: 7
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  conditions:
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'system-architect')
- slug: challenge-site-reliability-engineer
  description: 'Challenge packet: the Site Reliability Engineer challenges the drafted Nonfunctional requirements. Not itself challenged.'
  actor: site-reliability-engineer
  skills: site-reliability-engineer
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - nfr-refinement-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
