# ============================================================
# Host-agnostic model profile catalog — canonical model identity, independent of any host.
# ============================================================
# `slug` here is the CANONICAL model slug. It is NOT a host model argument by itself —
# a host may not understand these slugs directly. Each host adapter maps a canonical `slug` to that host's
# own model identifier via its own `saf-agentic-harness/adapters/<env>/models.yaml` (e.g. the VS Code
# Copilot Chat binding maps `claude-opus-4.8` -> `Claude Opus 4.8 (copilot)`; the GitHub Copilot app /
# Copilot CLI accepts the slug verbatim as the `task` tool's `model`).
#
# SCOPE RULE: `resolve-step-model` ranks EVERY profile below and returns the winner, so every slug
# here must be offered by every supported host AND bound in each host adapter's `models.yaml`.
# Both harness adapters refuse, at every hook load, a catalogue that names a slug their
# `models.yaml` does not bind (bootstrap failure: every governed tool call is then denied).
# A bound slug the host no longer offers is not refused: the GitHub Copilot app / Copilot CLI silently runs
# the subagent on another model but keeps the tool set of the model that was named (observed
# 2026-11-04: `gpt-5.5` ran as `claude-sonnet-5.5` with the GPT tool set — no `create` tool — so
# the actor could not write its artifact). Add a model only with all its host bindings.
#
# This file only carries identity + capability metadata (what the model IS), never routing policy
# (tiers, role-default floors, scoring, config profiles) — that policy stays in
# `conf/llm-routing.conf.yaml` and is expressed in terms of these canonical slugs.
#
# Fields:
#   slug               — internal canonical model slug (stable across hosts; hosts resolve it via
#                        their own adapters/<env>/models.yaml). Reuses the GitHub Copilot catalog
#                        model `id` as the slug verbatim where available (see saf-agentic-harness/adapters/<env>/models.yaml)
#                        so cross-referencing against that host's models.json stays trivial.
#   costRank           — relative cost, 1 (cheapest) .. 10 (most expensive). MECHANICALLY derived
#                        from each model's blended token price (0.25*input + 0.75*output, USD per
#                        1M tokens, from this host's models.json billing.token_prices), percentile-
#                        ranked across the 2026-07-04 20-model catalog. High confidence, reproducible.
#                        model's position on the Artificial Analysis Intelligence Index v4.1
#                        leaderboard (artificialanalysis.ai, snapshot 2026-07-04) where the model is
#                        directly observed there; otherwise interpolated from its family/generation
#                        position relative to observed siblings (flagged per-model below).
#   description        — human-readable summary, 120 characters max
#   capabilities       — relative 0..10 judgments per capability tag. Tags map to distinct
#                        Artificial Analysis evaluation categories (chosen because each one's
#                        leaderboard order was independently verified to diverge from the others —
#                        see "capability tag rationale" below); NOT vibes-based restatements of a
#                        single underlying "how good is this model" judgment.
#
# Capability tag rationale (revised 2026-07-04; supersedes the original 8-tag list):
#   deep-reasoning        — AA "Reasoning & knowledge" / GPQA Diamond / Humanity's Last Exam.
#   coding                — AA "Coding" index + AA Coding Agent Index (SWE-bench-style, pass@1).
#                           Renamed from `code-specialized`: this harness dispatches agentic
#                           coding (edit/build/test loops), which AA ranks separately from raw
#                           "Coding" — the coding-agent numbers are what's cited here.
#   tool-use              — AA "Agentic tool use" eval. Kept SEPARATE from agentic-coding because
#                           their leaderboard orders diverge (e.g. GPT-5.5 leads tool-use but not
#                           coding; Claude Fable 5 leads coding but not tool-use) — proof this is an
#                           independent axis, not a duplicate of code-specialized.
#   long-context          — AA-LCR ("long context reasoning") eval, not just raw context-window
#                           size (that's a hard limit already visible in the host's models.json).
#   multimodal            — AA "Visual reasoning" eval. Diverges sharply from every other axis
#                           (Gemini 3.x dominates here despite not leading overall intelligence).
#   writing-quality       — AA GDPval-AA v2 + AA-Briefcase (real-world deliverables: memos, decks,
#                           analysis). REPLACES the old `creative` + `editorial` pair: those two
#                           tags never actually diverged in practice and had no benchmark backing;
#                           this SAFe/OIP harness dispatches PRDs/ADRs/reviews, not fiction, so a
#                           real-world-deliverable-quality proxy is more pertinent than "creative."
#   instruction-following — AA "Instruction following" eval. ADDED: its leaderboard order is
#                           essentially uncorrelated with the Intelligence Index (the top reasoning
#                           models are NOT the top instruction-followers) — a genuinely independent,
#                           previously-missing signal that matters for agent-dispatch reliability.
#   fast-iteration        — AA "Output Speed" (tokens/sec), not merely 1/costRank (a fast model
#                           can still be expensive per token, e.g. claude-opus-4.8-fast).
#   schema-adherence      — ADDED (Replaces structured-output): SAFe orchestration relies entirely on
#                           complex YAML/JSON artifact contracts. While `models.json` claims uniform
#                           support, real-world reliability in generating deep nested schemas without
#                           hallucinating keys or breaking syntax has a massive observed gradient.
#                           This score (0..10) is essential to separate Tier-1 reasoning models from
#                           smaller models that fail on SAFe artifact layouts.
#
# Catalog scope (2026-11-04): the 6 profiled models that the GitHub Copilot app / Copilot CLI
# offers (its `task` model catalogue) AND that both harness adapters bind
# (`vscode-github-copilot-chat` and `github-copilot-cli` `models.yaml`). The 2026-07-04 snapshot
# held 20 models; the 14 no longer offered by the app (gpt-5.5, gpt-5.4, gpt-5.4-mini, gpt-5-mini,
# claude-opus-4.7/4.6/4.5, claude-sonnet-4.6/4.5, gemini-3.1-pro-preview, gemini-3.5-flash,
# gemini-2.5-pro, kimi-k2.7-code, mai-code-1-flash) were removed. Newer app models (e.g.
# claude-opus-5.5, claude-sonnet-5.5, gpt-5.6-*, gpt-6-*) need sourced capability scores and
# bindings in both adapters before they are added. `costRank` values are still the percentile
# ranks computed over the 2026-07-04 20-model snapshot; their relative order is unchanged.
#
# CONFIDENCE CAVEAT: Artificial Analysis publishes only its top-N models per chart; not every
# catalog model surfaced in every list fetched here. Where a model is not directly observed in a
# given AA ranking, its scores are interpolated from its family/generation position relative to
# siblings that WERE observed (e.g. `claude-opus-4.6` sits below the directly-observed
# `claude-opus-4.7`). This is lower-confidence than a directly observed rank and should be
# refreshed against artificialanalysis.ai per-model pages if this file starts driving real routing.
# ============================================================

modelProfiles:
  - slug: claude-fable-5
    costRank: 10
    description: "Anthropic's experimental Mythos-class model featuring 1M token context."
    note: "AA Intelligence Index #1; also #1 on AA-Briefcase/GDPval. Exceptional creative and complex workflow capability."
    capabilities:
      deep-reasoning: 10
      coding: 10
      tool-use: 8
      long-context: 7
      multimodal: 7
      writing-quality: 10
      instruction-following: 8
      fast-iteration: 3
      schema-adherence: 8

  - slug: claude-opus-4.8
    costRank: 8
    description: "Anthropic's flagship reasoning model."
    note: "AA #1 on coding & terminal use. Top-tier choice for deep reasoning and artifact generation."
    capabilities:
      deep-reasoning: 10
      coding: 9
      tool-use: 9
      long-context: 7
      multimodal: 6
      writing-quality: 9
      instruction-following: 8
      fast-iteration: 3
      schema-adherence: 9

  - slug: claude-sonnet-5
    costRank: 4
    description: "Anthropic's mid-tier balanced model."
    note: "AA #2 on agentic tool-use. Extremely cost-effective for its intelligence depth (ranks alongside heavier flagships)."
    capabilities:
      deep-reasoning: 8
      coding: 8
      tool-use: 9
      long-context: 6
      multimodal: 5
      writing-quality: 8
      instruction-following: 7
      fast-iteration: 4
      schema-adherence: 9

  - slug: claude-opus-4.8-fast
    costRank: 10
    description: "Anthropic's speed-optimized variant of Opus 4.8."
    note: "Trades some reasoning depth for latency. Useful when Opus quality is needed within tight timeout boundaries."
    capabilities:
      deep-reasoning: 8
      coding: 8
      tool-use: 8
      long-context: 6
      multimodal: 6
      writing-quality: 8
      instruction-following: 7
      fast-iteration: 6
      schema-adherence: 8

  - slug: gpt-5.3-codex
    costRank: 5
    description: "OpenAI's code-specialized model."
    note: "Highly tuned for implementation/test-heavy agentic dispatches. Schema adherence is notably robust."
    capabilities:
      deep-reasoning: 6
      coding: 9
      tool-use: 6
      long-context: 6
      multimodal: 3
      writing-quality: 5
      instruction-following: 7
      fast-iteration: 6
      schema-adherence: 9

  - slug: claude-haiku-4.5
    costRank: 3
    description: "Anthropic's fastest and most cost-effective older model."
    note: "Lowest reasoning depth natively, largely used for high-throughput single-step parsing tasks."
    capabilities:
      deep-reasoning: 3
      coding: 4
      tool-use: 4
      long-context: 3
      multimodal: 5
      writing-quality: 4
      instruction-following: 6
      fast-iteration: 10
      schema-adherence: 5
