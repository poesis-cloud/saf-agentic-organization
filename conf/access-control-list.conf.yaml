# Access control list: one role per agent, granting create and update on exactly the artifact
# kinds its workflow steps deliver. Generated from builds/model (make generate); nobody deletes.
# The harness authorizes a write by artifact kind, not by path: a layer, train or team folder is
# not a privilege boundary. Enablers are kinds of their own (`*-enabler`) so that each backlog
# kind has exactly one writer.

