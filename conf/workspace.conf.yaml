# Workspace layout: where every artifact kind lives. Generated from the organization model;
# a node slug is its own path segment, and `<name>` is a variable shared along the path.

nodes:
- slug: portfolio
  description: 'Workspace root: the SAFe portfolio.'
  children:
  - slug: strategic-themes.md
    description: Strategic Themes in OKR format.
    artifact: strategic-themes
    template: portfolio/strategic-themes
    cardinality: 0..1
  - slug: portfolio-vision.md
    description: Portfolio Vision and canvas.
    artifact: portfolio-vision
    template: portfolio/portfolio-vision
    cardinality: 0..1
  - slug: portfolio-roadmap.md
    description: Portfolio Roadmap.
    artifact: portfolio-roadmap
    template: portfolio/portfolio-roadmap
    cardinality: 0..1
  - slug: lean-budgets.md
    description: Lean Budgets and guardrails.
    artifact: lean-budgets
    template: portfolio/lean-budgets
    cardinality: 0..1
  - slug: architecture-vision.md
    description: Architecture Vision (technology vision, strategy, roadmap).
    artifact: architecture-vision
    template: portfolio/architecture-vision
    cardinality: 0..1
  - slug: portfolio-kanban.md
    description: portfolio Kanban board, rendered from the items' status.
    artifact: kanban
    template: kanbans/portfolio-kanban
    cardinality: 0..1
  - slug: challenges
    description: Expert challenge packets.
    children:
    - slug: <challenge-slug>.challenge.md
      description: Expert challenge packets on the portfolio artifacts of this folder.
      artifact: challenge
      template: shared/challenge
      cardinality: 0..*
  - slug: decisions
    description: Human gate decisions.
    children:
    - slug: <decision-slug>.gate-decision.md
      description: Human gate decisions on portfolio artifacts.
      artifact: gate-decision
      template: shared/gate-decision
      cardinality: 0..*
  - slug: events
    description: SAFe event records.
    children:
    - slug: <event-slug>.portfolio-sync.md
      description: One portfolio sync record.
      artifact: event-record
      template: events/portfolio-sync
      cardinality: 0..*
    - slug: <event-slug>.strategic-portfolio-review.md
      description: One strategic portfolio review record.
      artifact: event-record
      template: events/strategic-portfolio-review
      cardinality: 0..*
  - slug: value-streams
    description: Development value streams.
    children:
    - slug: <value-stream-slug>
      description: One value stream folder.
      children:
      - slug: <value-stream-slug>.value-stream.md
        description: One development value stream definition.
        artifact: value-stream
        template: portfolio/value-stream
        cardinality: 0..*
      - slug: challenges
        description: Expert challenge packets.
        children:
        - slug: <challenge-slug>.challenge.md
          description: Expert challenge packets on this value-stream.
          artifact: challenge
          template: shared/challenge
          cardinality: 0..*
  - slug: epics
    description: 'Portfolio Backlog: one folder per Epic.'
    children:
    - slug: <epic-slug>
      description: One epic folder.
      children:
      - slug: <epic-slug>.epic.md
        description: One Epic (business or enabler).
        artifact: epic
        template: portfolio/epic
        cardinality: 0..*
      - slug: <epic-slug>.lean-business-case.md
        description: The Epic's Lean Business Case.
        artifact: lean-business-case
        template: portfolio/lean-business-case
        cardinality: 0..*
      - slug: challenges
        description: Expert challenge packets.
        children:
        - slug: <challenge-slug>.challenge.md
          description: Expert challenge packets on this Epic and its Lean Business Case.
          artifact: challenge
          template: shared/challenge
          cardinality: 0..*
  - slug: solution-trains
    description: Solution Trains (Large Solution).
    children:
    - slug: <solution-train-slug>
      description: One solution train folder.
      children:
      - slug: solution-train-canvas.md
        description: Solution Train canvas.
        artifact: solution-train-canvas
        template: solution/solution-train-canvas
        cardinality: 0..1
      - slug: solution-vision.md
        description: Solution Vision.
        artifact: solution-vision
        template: solution/solution-vision
        cardinality: 0..1
      - slug: solution-roadmap.md
        description: Solution Roadmap.
        artifact: solution-roadmap
        template: solution/solution-roadmap
        cardinality: 0..1
      - slug: solution-intent.md
        description: Solution Intent.
        artifact: solution-intent
        template: solution/solution-intent
        cardinality: 0..1
      - slug: solution-train-kanban.md
        description: Solution Train Kanban board, rendered from the items' status.
        artifact: kanban
        template: kanbans/solution-train-kanban
        cardinality: 0..1
      - slug: challenges
        description: Expert challenge packets.
        children:
        - slug: <challenge-slug>.challenge.md
          description: Expert challenge packets on the Solution Train artifacts of this folder.
          artifact: challenge
          template: shared/challenge
          cardinality: 0..*
      - slug: decisions
        description: Human gate decisions.
        children:
        - slug: <decision-slug>.gate-decision.md
          description: Human gate decisions on Solution Train artifacts.
          artifact: gate-decision
          template: shared/gate-decision
          cardinality: 0..*
      - slug: events
        description: SAFe event records.
        children:
        - slug: <event-slug>.pre-plan.md
          description: One pre plan record.
          artifact: event-record
          template: events/pre-plan
          cardinality: 0..*
        - slug: <event-slug>.coordinate-and-deliver.md
          description: One coordinate and deliver record.
          artifact: event-record
          template: events/coordinate-and-deliver
          cardinality: 0..*
        - slug: <event-slug>.solution-demo.md
          description: One solution demo record.
          artifact: event-record
          template: events/solution-demo
          cardinality: 0..*
        - slug: <event-slug>.inspect-and-adapt.md
          description: One inspect and adapt record.
          artifact: event-record
          template: events/inspect-and-adapt
          cardinality: 0..*
      - slug: capabilities
        description: 'Solution Train Backlog: one folder per Capability.'
        children:
        - slug: <capability-slug>
          description: One capability folder.
          children:
          - slug: <capability-slug>.capability.md
            description: One Capability (business or enabler).
            artifact: capability
            template: solution/capability
            cardinality: 0..*
          - slug: challenges
            description: Expert challenge packets.
            children:
            - slug: <challenge-slug>.challenge.md
              description: Expert challenge packets on this capability.
              artifact: challenge
              template: shared/challenge
              cardinality: 0..*
      - slug: suppliers
        description: Suppliers of the Solution Train.
        children:
        - slug: <supplier-slug>
          description: One supplier folder.
          children:
          - slug: <supplier-slug>.supplier-agreement.md
            description: One supplier agreement.
            artifact: supplier-agreement
            template: solution/supplier-agreement
            cardinality: 0..*
          - slug: challenges
            description: Expert challenge packets.
            children:
            - slug: <challenge-slug>.challenge.md
              description: Expert challenge packets on this supplier-agreement.
              artifact: challenge
              template: shared/challenge
              cardinality: 0..*
      - slug: pis
        description: Planning Intervals.
        children:
        - slug: <pi-slug>
          description: One pi folder.
          children:
          - slug: pi-objectives.md
            description: Solution Train PI Objectives and plan for one PI.
            artifact: pi-objectives
            template: art/pi-objectives
            cardinality: 0..1
          - slug: challenges
            description: Expert challenge packets.
            children:
            - slug: <challenge-slug>.challenge.md
              description: Expert challenge packets on this PI plan.
              artifact: challenge
              template: shared/challenge
              cardinality: 0..*
  - slug: arts
    description: Agile Release Trains.
    children:
    - slug: <art-slug>
      description: One art folder.
      children:
      - slug: art-canvas.md
        description: ART canvas.
        artifact: art-canvas
        template: art/art-canvas
        cardinality: 0..1
      - slug: product-vision.md
        description: Product Vision.
        artifact: product-vision
        template: art/product-vision
        cardinality: 0..1
      - slug: product-roadmap.md
        description: PI Roadmap.
        artifact: product-roadmap
        template: art/product-roadmap
        cardinality: 0..1
      - slug: nfrs.md
        description: Nonfunctional requirements register.
        artifact: nfrs
        template: art/nfrs
        cardinality: 0..1
      - slug: delivery-pipeline.md
        description: Continuous Delivery Pipeline map.
        artifact: delivery-pipeline
        template: art/delivery-pipeline
        cardinality: 0..1
      - slug: art-kanban.md
        description: ART Kanban board, rendered from the items' status.
        artifact: kanban
        template: kanbans/art-kanban
        cardinality: 0..1
      - slug: challenges
        description: Expert challenge packets.
        children:
        - slug: <challenge-slug>.challenge.md
          description: Expert challenge packets on the ART artifacts of this folder.
          artifact: challenge
          template: shared/challenge
          cardinality: 0..*
      - slug: decisions
        description: Human gate decisions.
        children:
        - slug: <decision-slug>.gate-decision.md
          description: Human gate decisions on ART artifacts.
          artifact: gate-decision
          template: shared/gate-decision
          cardinality: 0..*
      - slug: events
        description: SAFe event records.
        children:
        - slug: <event-slug>.art-sync.md
          description: One art sync record.
          artifact: event-record
          template: events/art-sync
          cardinality: 0..*
        - slug: <event-slug>.system-demo.md
          description: One system demo record.
          artifact: event-record
          template: events/system-demo
          cardinality: 0..*
        - slug: <event-slug>.inspect-and-adapt.md
          description: One inspect and adapt record.
          artifact: event-record
          template: events/inspect-and-adapt
          cardinality: 0..*
      - slug: adrs
        description: Architecture decisions.
        children:
        - slug: <adr-slug>
          description: One adr folder.
          children:
          - slug: <adr-slug>.adr.md
            description: One architecture decision.
            artifact: adr
            template: art/adr
            cardinality: 0..*
          - slug: challenges
            description: Expert challenge packets.
            children:
            - slug: <challenge-slug>.challenge.md
              description: Expert challenge packets on this adr.
              artifact: challenge
              template: shared/challenge
              cardinality: 0..*
      - slug: features
        description: 'ART Backlog: one folder per Feature.'
        children:
        - slug: <feature-slug>
          description: One feature folder.
          children:
          - slug: <feature-slug>.feature.md
            description: One Feature (business or enabler).
            artifact: feature
            template: art/feature
            cardinality: 0..*
          - slug: challenges
            description: Expert challenge packets.
            children:
            - slug: <challenge-slug>.challenge.md
              description: Expert challenge packets on this feature.
              artifact: challenge
              template: shared/challenge
              cardinality: 0..*
      - slug: pis
        description: Planning Intervals.
        children:
        - slug: <pi-slug>
          description: One pi folder.
          children:
          - slug: pi-objectives.md
            description: ART PI Objectives and plan for one PI.
            artifact: pi-objectives
            template: art/pi-objectives
            cardinality: 0..1
          - slug: challenges
            description: Expert challenge packets.
            children:
            - slug: <challenge-slug>.challenge.md
              description: Expert challenge packets on this PI plan.
              artifact: challenge
              template: shared/challenge
              cardinality: 0..*
      - slug: releases
        description: Releases (Release on Demand).
        children:
        - slug: <release-slug>
          description: One release folder.
          children:
          - slug: <release-slug>.release.md
            description: One release plan and readiness record.
            artifact: release
            template: art/release
            cardinality: 0..*
          - slug: challenges
            description: Expert challenge packets.
            children:
            - slug: <challenge-slug>.challenge.md
              description: Expert challenge packets on this release.
              artifact: challenge
              template: shared/challenge
              cardinality: 0..*
      - slug: teams
        description: Agile teams of the ART.
        children:
        - slug: <team-slug>
          description: One team folder.
          children:
          - slug: team-charter.md
            description: Team charter.
            artifact: team-charter
            template: team/team-charter
            cardinality: 0..1
          - slug: team-kanban.md
            description: team Kanban board, rendered from the items' status.
            artifact: kanban
            template: kanbans/team-kanban
            cardinality: 0..1
          - slug: challenges
            description: Expert challenge packets.
            children:
            - slug: <challenge-slug>.challenge.md
              description: Expert challenge packets on the team artifacts of this folder.
              artifact: challenge
              template: shared/challenge
              cardinality: 0..*
          - slug: decisions
            description: Human gate decisions.
            children:
            - slug: <decision-slug>.gate-decision.md
              description: Human gate decisions on team artifacts.
              artifact: gate-decision
              template: shared/gate-decision
              cardinality: 0..*
          - slug: events
            description: SAFe event records.
            children:
            - slug: <event-slug>.team-sync.md
              description: One team sync record.
              artifact: event-record
              template: events/team-sync
              cardinality: 0..*
            - slug: <event-slug>.iteration-review.md
              description: One iteration review record.
              artifact: event-record
              template: events/iteration-review
              cardinality: 0..*
            - slug: <event-slug>.iteration-retrospective.md
              description: One iteration retrospective record.
              artifact: event-record
              template: events/iteration-retrospective
              cardinality: 0..*
          - slug: stories
            description: 'Team Backlog: one folder per Story.'
            children:
            - slug: <story-slug>
              description: One story folder.
              children:
              - slug: <story-slug>.story.md
                description: One Story (user or enabler).
                artifact: story
                template: team/story
                cardinality: 0..*
              - slug: <story-slug>.code-change.md
                description: The code change that implements the Story.
                artifact: code-change
                template: team/code-change
                cardinality: 0..*
              - slug: challenges
                description: Expert challenge packets.
                children:
                - slug: <challenge-slug>.challenge.md
                  description: Expert challenge packets on this Story and its code change.
                  artifact: challenge
                  template: shared/challenge
                  cardinality: 0..*
          - slug: iterations
            description: Iterations.
            children:
            - slug: <iteration-slug>
              description: One iteration folder.
              children:
              - slug: iteration-plan.md
                description: The team's plan for one iteration.
                artifact: iteration-plan
                template: team/iteration-plan
                cardinality: 0..1
              - slug: challenges
                description: Expert challenge packets.
                children:
                - slug: <challenge-slug>.challenge.md
                  description: Expert challenge packets on this iteration plan.
                  artifact: challenge
                  template: shared/challenge
                  cardinality: 0..*
