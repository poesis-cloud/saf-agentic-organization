---
# CI baseline for saf-agentic-organization
# Runs on every push and PR to main.
# Jobs: markdown lint, YAML lint, license-header check, WITHHOLD scrub, verify (tests + both host bundles).

name: ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    lint-markdown:
        name: Lint Markdown
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run markdownlint-cli2
              uses: DavidAnson/markdownlint-cli2-action@v19
              with:
                  globs: "**/*.md"
                  config: ".markdownlint.yaml"

    lint-yaml:
        name: Lint YAML
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install yamllint
              run: pip install yamllint --quiet

            - name: Run yamllint
              run: yamllint -d relaxed .

    check-license-headers:
        name: Check License Headers
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Check Apache-2.0 headers on shipped files
              run: |
                  MISSING=""
                  while IFS= read -r -d '' f; do
                    if ! grep -q "Copyright 2026 Poesis Cloud" "$f"; then
                      MISSING="$MISSING\n  $f"
                    fi
                  done < <(find agents skills instructions conf workflows templates artifacts \( -name '*.md' -o -name '*.yaml' \) -print0 2>/dev/null)
                  if [ -n "$MISSING" ]; then
                    printf "ERROR: missing Apache-2.0 header in:%b\n" "$MISSING"
                    exit 1
                  fi
                  echo "OK: all shipped files carry the Apache-2.0 header"

    scrub-withhold:
        name: WITHHOLD Scrub
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Scan shipped content for WITHHOLD keywords
              # Any keyword hit in shipped content fails the build. The corpus is private (moved out of
              # this public repository in 9f16e85): it is read from the WITHHOLD_KEYWORDS secret, or from
              # a local WITHHOLD-keywords.txt. Without either (e.g. fork PRs), the scan is skipped with a
              # notice and IP safety rests on authorship discipline.
              env:
                  WITHHOLD_KEYWORDS: ${{ secrets.WITHHOLD_KEYWORDS }}
              run: |
                  if [ ! -f WITHHOLD-keywords.txt ]; then
                    if [ -z "$WITHHOLD_KEYWORDS" ]; then
                      echo "::notice::WITHHOLD corpus not available (no WITHHOLD_KEYWORDS secret) — scan skipped"
                      exit 0
                    fi
                    printf '%s\n' "$WITHHOLD_KEYWORDS" > WITHHOLD-keywords.txt
                  fi
                  SCAN_DIRS=""
                  for d in agents skills instructions conf workflows templates artifacts; do
                    [ -d "$d" ] && SCAN_DIRS="$SCAN_DIRS $d"
                  done
                  if [ -z "$SCAN_DIRS" ]; then
                    echo "OK: no shipped content directories — nothing to scan"
                    exit 0
                  fi
                  HITS=""
                  while IFS= read -r kw; do
                    [[ "$kw" =~ ^#.*$ || -z "$kw" ]] && continue
                    matches=$(grep -r -i -l "$kw" $SCAN_DIRS 2>/dev/null || true)
                    if [ -n "$matches" ]; then
                      HITS="$HITS\n  keyword='$kw' in: $matches"
                    fi
                  done < WITHHOLD-keywords.txt
                  if [ -n "$HITS" ]; then
                    printf "ERROR: WITHHOLD keyword hits in shipped content:%b\n" "$HITS"
                    exit 1
                  fi
                  echo "OK: zero WITHHOLD keyword hits in shipped content"

    verify:
        name: Verify
        runs-on: ubuntu-latest
        steps:
            - name: Checkout organization
              uses: actions/checkout@v4

            - name: Checkout harness
              uses: actions/checkout@v4
              with:
                  repository: poesis-cloud/saf-agentic-harness
                  path: .harness

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install test dependencies
              run: python3 -m pip install -r requirements-dev.txt

            - name: make verify
              run: make verify SAF_HARNESS_SRC=.harness/src
