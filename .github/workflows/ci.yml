---
# CI baseline for saf-agentic-organization
# Runs on every push and PR to main.
# Jobs: markdown lint, YAML lint, license-header check, WITHHOLD scrub, verify (tests + the plugin:
# render, Agent Plugins schema, Copilot CLI install), installers.

name: ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    lint-markdown:
        name: Lint Markdown
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run markdownlint-cli2
              uses: DavidAnson/markdownlint-cli2-action@v19
              with:
                  globs: "**/*.md"
                  config: ".markdownlint.yaml"

    lint-yaml:
        name: Lint YAML
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install yamllint
              run: pip install yamllint --quiet

            - name: Run yamllint
              run: yamllint -d relaxed .

    check-license-headers:
        name: Check License Headers
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Check Apache-2.0 headers on shipped files
              run: |
                  MISSING=""
                  while IFS= read -r -d '' f; do
                    if ! grep -q "Copyright 2026 Poesis Cloud" "$f"; then
                      MISSING="$MISSING\n  $f"
                    fi
                  done < <(find agents skills instructions conf workflows templates artifacts \( -name '*.md' -o -name '*.yaml' \) -print0 2>/dev/null)
                  if [ -n "$MISSING" ]; then
                    printf "ERROR: missing Apache-2.0 header in:%b\n" "$MISSING"
                    exit 1
                  fi
                  echo "OK: all shipped files carry the Apache-2.0 header"

    scrub-withhold:
        name: WITHHOLD Scrub
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Scan shipped content for WITHHOLD keywords
              # Any keyword hit in shipped content fails the build. The corpus is private (moved out of
              # this public repository in 9f16e85): it is read from the WITHHOLD_KEYWORDS secret, or from
              # a local WITHHOLD-keywords.txt. Without either (e.g. fork PRs), the scan is skipped with a
              # notice and IP safety rests on authorship discipline.
              env:
                  WITHHOLD_KEYWORDS: ${{ secrets.WITHHOLD_KEYWORDS }}
              run: |
                  if [ ! -f WITHHOLD-keywords.txt ]; then
                    if [ -z "$WITHHOLD_KEYWORDS" ]; then
                      echo "::notice::WITHHOLD corpus not available (no WITHHOLD_KEYWORDS secret) — scan skipped"
                      exit 0
                    fi
                    printf '%s\n' "$WITHHOLD_KEYWORDS" > WITHHOLD-keywords.txt
                  fi
                  SCAN_DIRS=""
                  for d in agents skills instructions conf workflows templates artifacts; do
                    [ -d "$d" ] && SCAN_DIRS="$SCAN_DIRS $d"
                  done
                  if [ -z "$SCAN_DIRS" ]; then
                    echo "OK: no shipped content directories — nothing to scan"
                    exit 0
                  fi
                  HITS=""
                  while IFS= read -r kw; do
                    [[ "$kw" =~ ^#.*$ || -z "$kw" ]] && continue
                    matches=$(grep -r -i -l "$kw" $SCAN_DIRS 2>/dev/null || true)
                    if [ -n "$matches" ]; then
                      HITS="$HITS\n  keyword='$kw' in: $matches"
                    fi
                  done < WITHHOLD-keywords.txt
                  if [ -n "$HITS" ]; then
                    printf "ERROR: WITHHOLD keyword hits in shipped content:%b\n" "$HITS"
                    exit 1
                  fi
                  echo "OK: zero WITHHOLD keyword hits in shipped content"

    verify:
        name: Verify
        runs-on: ubuntu-latest
        steps:
            - name: Checkout organization
              uses: actions/checkout@v4

            - name: Checkout harness
              # The harness specs are the reference: test against harness `main`, which must
              # carry the harness plugin and the harness compatibility check (8598e33 or later).
              uses: actions/checkout@v4
              with:
                  repository: poesis-cloud/saf-agentic-harness
                  ref: main
                  path: .harness
                  fetch-depth: 0

            - name: Require harness main at 8598e33 or later
              run: |
                  git -C .harness merge-base --is-ancestor 8598e33 HEAD
                  echo "harness main at $(git -C .harness rev-parse --short HEAD)"

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install test dependencies
              run: python3 -m pip install -r requirements-dev.txt

            - name: make verify
              run: make verify SAF_HARNESS_SRC=.harness/src

            - name: Render the plugin
              # The live-tree contract is asserted by tests/unit/test_render_plugin.py; this
              # proves the documented `make plugin` entry point renders outside the source.
              run: |
                  make plugin PLUGIN_DIR="$RUNNER_TEMP/plugin"
                  test -f "$RUNNER_TEMP/plugin/com.github.copilot/hooks/hooks.json"
                  test -f "$RUNNER_TEMP/plugin/skills/init/SKILL.md"

            - name: Validate the manifest against the official Agent Plugins schema
              run: |
                  curl -sSfL -o "$RUNNER_TEMP/plugin.schema.json" \
                      https://raw.githubusercontent.com/agentplugins/agent-plugins-spec/main/schemas/1.0.0/plugin.schema.json
                  python3 .github/scripts/validate_plugin_manifest.py "$RUNNER_TEMP/plugin/plugin.json" \
                      "$RUNNER_TEMP/plugin.schema.json"

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install the plugin with the Copilot CLI (unauthenticated)
              run: |
                  npm install --global --silent @github/copilot
                  export COPILOT_HOME="$RUNNER_TEMP/copilot-home"
                  copilot --version
                  copilot plugin install "$RUNNER_TEMP/plugin"
                  copilot plugin list | tee "$RUNNER_TEMP/plugins.txt"
                  grep -F "poesis-saf-agentic-organization" "$RUNNER_TEMP/plugins.txt"

    installers:
        name: Installers (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Check install.sh
              if: runner.os != 'Windows'
              run: |
                  sh -n install.sh
                  sh install.sh --help

            - name: Check install.ps1
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $errors = $null
                  [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
                  if ($errors) { $errors; exit 1 }
                  ./install.ps1 -Help
