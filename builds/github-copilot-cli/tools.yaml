# GitHub Copilot app / Copilot CLI tool map — rendered into each agent's `tools:` frontmatter.
# Names are Copilot CLI tool aliases (case-insensitive): `read` (view), `edit` (create/edit),
# `search` (grep/glob), `execute` (bash on Linux/macOS, powershell on Windows), `agent` (the
# `task` subagent-dispatch tool). `skill` and `ask_user` are concrete CLI tool names; the CLI
# ignores names it does not know. Only the orchestrators get `agent` (dispatch) and `ask_user`
# (the human gate); the bench never dispatches.

commonTools: &commonTools [read, edit, search, execute, skill]

dispatchTools: &dispatchTools [read, edit, search, execute, agent, skill, ask_user]

agents:
  agents/business-owner.agent.md: *commonTools
  agents/enterprise-architect.agent.md: *commonTools
  agents/value-management-officer.agent.md: *dispatchTools
  agents/product-manager.agent.md: *commonTools
  agents/release-train-engineer.agent.md: *dispatchTools
  agents/system-architect.agent.md: *commonTools
  agents/developer.agent.md: *commonTools
  agents/operator.agent.md: *commonTools
  agents/product-owner.agent.md: *commonTools
  agents/quality-engineer.agent.md: *commonTools
  agents/scrum-master.agent.md: *dispatchTools
  agents/security-expert.agent.md: *commonTools
  agents/tech-writer.agent.md: *commonTools
  agents/ux-designer.agent.md: *commonTools
