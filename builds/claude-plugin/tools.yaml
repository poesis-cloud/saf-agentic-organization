# Claude Code tool map: each host-agnostic tool alias of builds/plugin/tools.yaml (the
# per-agent tool lists the model generates) -> the Claude Code tools it grants. The per-agent
# lists stay single-sourced; only the vocabulary is translated here.
aliases:
  read: [Read]
  edit: [Write, Edit]
  search: [Grep, Glob]
  execute: [Bash]
  agent: [Agent]
  skill: [Skill]
  ask_user: [AskUserQuestion]
