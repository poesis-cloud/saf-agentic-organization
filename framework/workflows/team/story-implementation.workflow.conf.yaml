slug: story-implementation
description: 'Implement one ready Story test-first in its code repository and record the change with its evidence; experts review it before the human merges. Main artifact at the human gate: code-change. Use for: Build a story; write the code; fix a defect.'
orchestrator: scrum-master
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- scrum-master-catalog
steps:
- slug: draft
  description: 'Main artifact, draft: the Software Engineer creates or thickens the Code change.'
  actor: software-engineer
  skills: software-engineer
  artifact: code-change
  instructions:
  - step-contract
  - draft-main
  - story-implementation-brief
  capabilities:
    deep-reasoning: 7
    coding: 10
    tool-use: 9
    long-context: 7
    multimodal: 0
    writing-quality: 4
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 6
  conditions:
  - kind: precondition
    slug: a-story-is-ready
    setSelector:
      setQuery: workspace.filter(a, a.kind == 'story' && a.data.status in ['ready', 'in-progress'])
    setPredicate: selected.size() > 0
  - kind: postcondition
    slug: change-implements-a-planned-story
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, workspace.exists(s, s.kind == 'story' && s.path == a.data.story && s.data.status in ['ready', 'in-progress', 'in-review']))
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'software-engineer')
- slug: challenge-quality-engineer
  description: 'Challenge packet: the Quality Engineer challenges the drafted Code change. Not itself challenged.'
  actor: quality-engineer
  skills: quality-engineer
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - story-implementation-brief
  capabilities:
    deep-reasoning: 8
    coding: 9
    tool-use: 7
    long-context: 7
    multimodal: 0
    writing-quality: 5
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
