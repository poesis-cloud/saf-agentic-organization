- slug: revise
  description: 'Main artifact, owner revision: the Software Engineer answers every challenge packet and revises the Code change for the human gate.'
  actor: software-engineer
  skills: software-engineer
  artifact: code-change
  instructions:
  - step-contract
  - revise-main
  - story-implementation-brief
  capabilities:
    deep-reasoning: 7
    coding: 10
    tool-use: 9
    long-context: 7
    multimodal: 0
    writing-quality: 4
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 6
  conditions:
  - kind: precondition
    slug: after-challenge-quality-engineer
    step: challenge-quality-engineer
  - kind: precondition
    slug: after-challenge-security-expert
    step: challenge-security-expert
  - kind: precondition
    slug: after-challenge-observability-engineer
    step: challenge-observability-engineer
  - kind: precondition
    slug: after-challenge-database-administrator
    step: challenge-database-administrator
  - kind: precondition
    slug: after-challenge-accessibility-specialist
    step: challenge-accessibility-specialist
  - kind: postcondition
    slug: revises-the-drafted-artifact
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == step.artifact.path)
    setPredicate: selected.size() == 1
  - kind: postcondition
    slug: every-packet-is-answered
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.outcome == 'pass' && s.artifact.kind == 'challenge')
    setPredicate: selected.all(s, workspace.exists(m, m.path == step.artifact.path && m.data.challengeLedger.exists(l, has(l.packet) && l.packet == s.artifact.path)))
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'software-engineer')
