slug: iteration-planning
description: 'Plan one iteration: the iteration goals, the Stories selected and the capacity behind them. Main artifact at the human gate: iteration-plan. Use for: Plan the iteration; what the team commits to; iteration goals.'
orchestrator: scrum-master
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- scrum-master-catalog
steps:
- slug: draft
  description: 'Main artifact, draft: the Scrum Master / Team Coach creates or thickens the Iteration plan.'
  actor: scrum-master
  skills: scrum-master
  artifact: iteration-plan
  instructions:
  - step-contract
  - draft-main
  - iteration-planning-brief
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 5
    long-context: 7
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 3
    schema-adherence: 8
  conditions:
  - kind: precondition
    slug: a-story-is-ready
    setSelector:
      setQuery: workspace.filter(a, a.kind == 'story' && a.data.status in ['ready', 'in-progress'])
    setPredicate: selected.size() > 0
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'scrum-master')
- slug: challenge-product-owner
  description: 'Challenge packet: the Product Owner challenges the drafted Iteration plan. Not itself challenged.'
  actor: product-owner
  skills: product-owner
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - iteration-planning-brief
  capabilities:
    deep-reasoning: 8
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-software-engineer
  description: 'Challenge packet: the Software Engineer challenges the drafted Iteration plan. Not itself challenged.'
  actor: software-engineer
  skills: software-engineer
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - iteration-planning-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-quality-engineer
  description: 'Challenge packet: the Quality Engineer challenges the drafted Iteration plan. Not itself challenged.'
  actor: quality-engineer
  skills: quality-engineer
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - iteration-planning-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: revise
  description: 'Main artifact, owner revision: the Scrum Master / Team Coach answers every challenge packet and revises the Iteration plan for the human gate.'
  actor: scrum-master
  skills: scrum-master
  artifact: iteration-plan
  instructions:
  - step-contract
  - revise-main
  - iteration-planning-brief
  capabilities:
    deep-reasoning: 7
    coding: 0
    tool-use: 5
    long-context: 7
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 3
    schema-adherence: 8
  conditions:
  - kind: precondition
    slug: after-challenge-product-owner
    step: challenge-product-owner
  - kind: precondition
    slug: after-challenge-software-engineer
    step: challenge-software-engineer
  - kind: precondition
    slug: after-challenge-quality-engineer
    step: challenge-quality-engineer
  - kind: postcondition
    slug: revises-the-drafted-artifact
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == step.artifact.path)
    setPredicate: selected.size() == 1
  - kind: postcondition
    slug: every-packet-is-answered
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.outcome == 'pass' && s.artifact.kind == 'challenge')
    setPredicate: selected.all(s, workspace.exists(m, m.path == step.artifact.path && m.data.challengeLedger.exists(l, has(l.packet) && l.packet == s.artifact.path)))
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'scrum-master')
