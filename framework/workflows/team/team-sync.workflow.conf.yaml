slug: team-sync
description: 'Inspect progress toward the iteration goals, adjust the plan for the coming day, and re-render the Team Kanban. Main artifact at the human gate: event-record. Use for: Daily status of the team; what is blocked; progress toward the iteration goals.'
orchestrator: scrum-master
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- scrum-master-catalog
steps:
- slug: record
  description: 'Event record: the Scrum Master / Team Coach writes the Team Sync record.'
  actor: scrum-master
  skills: scrum-master
  artifact: event-record
  instructions:
  - step-contract
  - record-event
  - team-sync-brief
  capabilities:
    deep-reasoning: 4
    coding: 0
    tool-use: 4
    long-context: 5
    multimodal: 0
    writing-quality: 6
    instruction-following: 9
    fast-iteration: 8
    schema-adherence: 9
  conditions: []
- slug: update-kanban
  description: 'Flow record: the Scrum Master / Team Coach re-renders the Kanban board from the items'' status.'
  actor: scrum-master
  skills: scrum-master
  artifact: kanban
  instructions:
  - step-contract
  - update-kanban
  - team-sync-brief
  capabilities:
    deep-reasoning: 2
    coding: 0
    tool-use: 5
    long-context: 5
    multimodal: 0
    writing-quality: 3
    instruction-following: 9
    fast-iteration: 9
    schema-adherence: 10
  conditions:
  - kind: precondition
    slug: after-record
    step: record
