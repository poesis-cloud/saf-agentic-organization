slug: story-transition
description: 'Record the human''s decision to move one Story to a new Team Kanban state, then re-render the Team Kanban. Main artifact at the human gate: story. Use for: "This story is ready / started / accepted".'
orchestrator: scrum-master
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- scrum-master-catalog
steps:
- slug: record-transition
  description: 'Owner step: the Product Owner records the human''s decision as one state change of the Story, or refuses it with the reason.'
  actor: product-owner
  skills: product-owner
  artifact: story
  instructions:
  - step-contract
  - record-transition
  - story-transition-brief
  capabilities:
    deep-reasoning: 4
    coding: 0
    tool-use: 4
    long-context: 5
    multimodal: 0
    writing-quality: 6
    instruction-following: 9
    fast-iteration: 8
    schema-adherence: 9
  conditions:
  - kind: postcondition
    slug: challenged-before-ready
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path && a.data.status != 'backlog')
    setPredicate: selected.all(a, size(a.data.challengeLedger) > 0)
  - kind: postcondition
    slug: accepted-story-has-no-unmerged-change
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path && a.data.status == 'accepted')
    setPredicate: selected.all(a, !workspace.exists(c, c.kind == 'code-change' && c.data.story == a.path && c.data.status != 'merged'))
- slug: update-kanban
  description: 'Flow record: the Scrum Master / Team Coach re-renders the Kanban board from the items'' status.'
  actor: scrum-master
  skills: scrum-master
  artifact: kanban
  instructions:
  - step-contract
  - update-kanban
  - story-transition-brief
  capabilities:
    deep-reasoning: 2
    coding: 0
    tool-use: 5
    long-context: 5
    multimodal: 0
    writing-quality: 3
    instruction-following: 9
    fast-iteration: 9
    schema-adherence: 10
  conditions:
  - kind: precondition
    slug: after-record-transition
    step: record-transition
