- slug: revise
  description: 'Main artifact, owner revision: the Portfolio Manager answers every challenge packet and revises the Lean Budgets for the human gate.'
  actor: portfolio-manager
  skills: portfolio-manager
  artifact: lean-budgets
  instructions:
  - step-contract
  - revise-main
  - strategic-investment-planning-brief
  capabilities:
    deep-reasoning: 9
    coding: 0
    tool-use: 4
    long-context: 7
    multimodal: 0
    writing-quality: 9
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  conditions:
  - kind: precondition
    slug: after-challenge-financial-controller
    step: challenge-financial-controller
  - kind: precondition
    slug: after-challenge-enterprise-architect
    step: challenge-enterprise-architect
  - kind: precondition
    slug: after-challenge-business-owner
    step: challenge-business-owner
  - kind: precondition
    slug: after-challenge-finops-engineer
    step: challenge-finops-engineer
  - kind: postcondition
    slug: revises-the-drafted-artifact
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == step.artifact.path)
    setPredicate: selected.size() == 1
  - kind: postcondition
    slug: every-packet-is-answered
    setSelector:
      setQuery: steps.filter(s, s.workflow == workflow.id && s.outcome == 'pass' && s.artifact.kind == 'challenge')
    setPredicate: selected.all(s, workspace.exists(m, m.path == step.artifact.path && m.data.challengeLedger.exists(l, has(l.packet) && l.packet == s.artifact.path)))
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'portfolio-manager')
