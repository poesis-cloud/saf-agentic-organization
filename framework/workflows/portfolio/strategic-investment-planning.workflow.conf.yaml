slug: strategic-investment-planning
description: 'Establish or update Lean value stream budgets and their guardrails for the coming budget period (formerly Participatory Budgeting). Main artifact at the human gate: lean-budgets. Use for: Budgets per value stream; funding; guardrails; capacity allocation; investment horizons.'
orchestrator: value-management-officer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- value-management-officer-catalog
predecessors:
- strategic-themes
steps:
- slug: draft
  description: 'Main artifact, draft: the Portfolio Manager creates or thickens the Lean Budgets.'
  actor: portfolio-manager
  skills: portfolio-manager
  artifact: lean-budgets
  instructions:
  - step-contract
  - draft-main
  - strategic-investment-planning-brief
  capabilities:
    deep-reasoning: 9
    coding: 0
    tool-use: 4
    long-context: 7
    multimodal: 0
    writing-quality: 9
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  conditions:
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'portfolio-manager')
- slug: challenge-financial-controller
  description: 'Challenge packet: the Financial Controller challenges the drafted Lean Budgets. Not itself challenged.'
  actor: financial-controller
  skills: financial-controller
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - strategic-investment-planning-brief
  capabilities:
    deep-reasoning: 8
    coding: 0
    tool-use: 3
    long-context: 6
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
- slug: challenge-enterprise-architect
  description: 'Challenge packet: the Enterprise Architect challenges the drafted Lean Budgets. Not itself challenged.'
  actor: enterprise-architect
  skills: enterprise-architect
