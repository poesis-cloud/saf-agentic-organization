slug: inspect-and-adapt
description: >
  Purpose: PI quantitative/qualitative improve. Act: Cadence. Orchestrator:
  Release Train Engineer. Dispatch: the PI's inspect-and-adapt mediation record
  (metrics, pain-point candidates, triage). Writes no pain point: each candidate
  or triage row is a later improvement-backlog run. Do not Evaluate the record.
  A resulting Feature or Enabler is a later Demand (feature-backlog-refinement),
  not I&A writing a Feature.
instructions: release-train-engineer-interpret-speech-acts
orchestrator: release-train-engineer
skills: program-inspect-and-adapt
steps:
  - slug: metrics-review
    description: Mediation record — Release Train Engineer creates the PI's Inspect & Adapt record with the metrics and pain-point candidates. Not itself challenged.
    capabilities:
      deep-reasoning: 7
      coding: 0
      tool-use: 4
      long-context: 6
      multimodal: 0
      writing-quality: 8
      instruction-following: 8
      fast-iteration: 2
      schema-adherence: 8
    actor: release-train-engineer
    artifact: inspect-and-adapt
    instructions:
      - program-inspect-and-adapt-metrics-review
  - slug: pi-retrospective
    description: Mediation record — Release Train Engineer updates the PI's Inspect & Adapt record with the problem-solving workshop triage. Not itself challenged.
    capabilities:
      deep-reasoning: 7
      coding: 0
      tool-use: 4
      long-context: 6
      multimodal: 0
      writing-quality: 8
      instruction-following: 8
      fast-iteration: 2
      schema-adherence: 8
    actor: release-train-engineer
    artifact: inspect-and-adapt
    instructions:
      - program-inspect-and-adapt-retrospective
    conditions:
      - slug: after-metrics-review
        kind: precondition
        step: metrics-review
