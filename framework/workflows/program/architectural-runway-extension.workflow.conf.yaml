slug: architectural-runway-extension
description: >
  Purpose: extend ART architectural runway. Orchestrator: Release
  Train Engineer. In-scope mains: nfr-list, adr, architecture-runway.
  nfr-list is the product singleton at portfolio/products/<product-slug>/nfr-list.md,
  not a Feature-folder file. It is a precondition for ADR production.
  Same workflow for ADR needed, new or changed product NFR, runway gap,
  structurant architecture. Challenges of that packet: security,
  operability, feasibility (not evaluated). Owner updates: the System
  Architect then updates the NFR list and the ADR, and rewrites the runway
  register; then the Product Manager writes the packet's decisions on the
  business Feature into it and the System Architect those on the Enabler
  Feature (adrs, architectureInventory, NFR trace, Architecture Gate open
  items; a Feature the packet does not touch gets a no-change entry).
  Evaluate: those mains; KO
  reiterates the workflow (new instance; that main's owner step absorbs the KO). Late-seeded Enabler Feature forces
  Feature refinement replay before the Architecture Gate is restaged.
  Refuse Feature AC/WSJF shaping (that is feature-backlog-refinement).
  Refuse portfolio NFR backbone (that is architectural-vision). PI Planning
  only confirms runway; it does not author it.
instructions: release-train-engineer-interpret-speech-acts
predecessors:
- feature-backlog-refinement
orchestrator: release-train-engineer
skills: program-architectural-runway-extension
