slug: delivery-pipeline
description: 'Map the ART''s Continuous Delivery Pipeline from ideation to on-demand release, find its bottlenecks and propose the enablers that remove them. Main artifact at the human gate: delivery-pipeline. Use for: How work flows to production; pipeline bottlenecks; DevOps improvements; lead time.'
orchestrator: release-train-engineer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- release-train-engineer-catalog
steps:
- slug: draft
  description: 'Main artifact, draft: the DevOps Engineer creates or thickens the Continuous Delivery Pipeline.'
  actor: devops-engineer
  skills: devops-engineer
  artifact: delivery-pipeline
  instructions:
  - step-contract
  - draft-main
  - delivery-pipeline-brief
  capabilities:
    deep-reasoning: 9
    coding: 4
    tool-use: 5
    long-context: 7
    multimodal: 0
    writing-quality: 7
    instruction-following: 8
    fast-iteration: 2
    schema-adherence: 8
  conditions:
  - kind: postcondition
    slug: owner-is-the-author
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path)
    setPredicate: selected.all(a, a.data.owner == 'devops-engineer')
- slug: challenge-platform-engineer
  description: 'Challenge packet: the Platform Engineer challenges the drafted Continuous Delivery Pipeline. Not itself challenged.'
  actor: platform-engineer
  skills: platform-engineer
  artifact: challenge
  instructions:
  - step-contract
  - challenge-main
  - delivery-pipeline-brief
  capabilities:
    deep-reasoning: 8
    coding: 5
    tool-use: 4
    long-context: 6
    multimodal: 0
    writing-quality: 6
    instruction-following: 8
    fast-iteration: 4
    schema-adherence: 7
  conditions:
  - kind: precondition
    slug: after-draft
    step: draft
  - kind: postcondition
    slug: packet-targets-the-drafted-artifact
    setSelector:
      setQuery: workspace.filter(c, c.path == step.artifact.path && steps.exists(s, s.workflow == workflow.id && s.slug == 'draft' && s.outcome == 'pass' && s.artifact.path == c.data.target))
    setPredicate: selected.size() == 1
