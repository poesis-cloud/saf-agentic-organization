slug: adr-transition
description: 'Record the human''s decision on one architecture decision as a state change. Main artifact at the human gate: adr. Use for: "Accept / reject this architecture decision"; a newer decision replaces it.'
orchestrator: release-train-engineer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- release-train-engineer-catalog
steps:
- slug: record-transition
  description: 'Owner step: the System Architect records the human''s decision as one state change of the Architecture decision, or refuses it with the reason.'
  actor: system-architect
  skills: system-architect
  artifact: adr
  instructions:
  - step-contract
  - record-transition
  - adr-transition-brief
  capabilities:
    deep-reasoning: 4
    coding: 0
    tool-use: 4
    long-context: 5
    multimodal: 0
    writing-quality: 6
    instruction-following: 9
    fast-iteration: 8
    schema-adherence: 9
  conditions:
  - kind: postcondition
    slug: challenged-before-accepted
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path && a.data.status in ['accepted', 'superseded'])
    setPredicate: selected.all(a, size(a.data.challengeLedger) > 0)
