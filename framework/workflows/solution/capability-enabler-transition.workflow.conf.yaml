slug: capability-enabler-transition
description: 'Record the human''s decision to move one enabler Capability to a new Solution Train Kanban state, then re-render the Solution Train Kanban. Main artifact at the human gate: capability-enabler. Use for: "Approve / move / accept this enabler capability" after a gate or a Solution Demo.'
orchestrator: solution-train-engineer
instructions:
- workflow-selection-handling
- step-resolution-handling
- no-next-step-handling
- reports-handling
- solution-train-engineer-catalog
steps:
- slug: record-transition
  description: 'Owner step: the Solution Architect records the human''s decision as one state change of the Enabler Capability, or refuses it with the reason.'
  actor: solution-architect
  skills: solution-architect
  artifact: capability-enabler
  instructions:
  - step-contract
  - record-transition
  - capability-enabler-transition-brief
  capabilities:
    deep-reasoning: 4
    coding: 0
    tool-use: 4
    long-context: 5
    multimodal: 0
    writing-quality: 6
    instruction-following: 9
    fast-iteration: 8
    schema-adherence: 9
  conditions:
  - kind: postcondition
    slug: challenged-before-ready
    setSelector:
      setQuery: workspace.filter(a, a.path == step.artifact.path && !(a.data.status in ['funnel', 'analyzing']))
    setPredicate: selected.all(a, size(a.data.challengeLedger) > 0)
- slug: update-kanban
  description: 'Flow record: the Solution Train Engineer re-renders the Kanban board from the items'' status.'
  actor: solution-train-engineer
  skills: solution-train-engineer
  artifact: kanban
  instructions:
  - step-contract
  - update-kanban
  - capability-enabler-transition-brief
  capabilities:
    deep-reasoning: 2
    coding: 0
    tool-use: 5
    long-context: 5
    multimodal: 0
    writing-quality: 3
    instruction-following: 9
    fast-iteration: 9
    schema-adherence: 10
  conditions:
  - kind: precondition
    slug: after-record-transition
    step: record-transition
